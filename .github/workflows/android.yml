name: Build AI Football Analyzer APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          ls -la
          test -f AI_Football_Analyzer_Pro_Live_Design_Project.zip

      - name: Extract project
        run: |
          unzip -o AI_Football_Analyzer_Pro_Live_Design_Project.zip -d extracted
          test -f extracted/footballapk/settings.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p extracted/footballapk assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Football-Analyzer-APK
          path: extracted/footballapk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
